services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ToDoList_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kondratiev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=ToDoList_db
      - DB_USER=postgres
      - DB_PASSWORD=kondratiev
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-dev-key-change-in-production

volumes:
  postgres_data: